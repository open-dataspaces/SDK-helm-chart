{{- $keycloakInternalUrl := printf "http://%s-keycloak:%v" (include "l3.base" .) .Values.keycloak.service.httpPort -}}
{{- $keycloakPublicUrl := default $keycloakInternalUrl .Values.keycloak.externalUrl -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "l3.base" . }}-keycloak
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "l3.base" . }}-keycloak
  template:
    metadata:
      labels:
        app: {{ include "l3.base" . }}-keycloak
    spec:
      containers:
      - name: keycloak
        image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args: ["start-dev"]
        ports:
        - containerPort: {{ .Values.keycloak.service.httpPort }}
        - containerPort: {{ .Values.keycloak.service.httpsPort }}
        env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "l3.base" . }}-secrets
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KC_LOG_LEVEL
          value: info
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          value: {{ include "l3.base" . }}-postgres
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "l3.base" . }}-secrets
              key: KEYCLOAK_DB_PASSWORD
        - name: KC_HTTP_PORT
          value: "{{ .Values.keycloak.service.httpPort }}"
        - name: KC_HOSTNAME
          value: {{ $keycloakPublicUrl | quote }}
        - name: KC_HOSTNAME_URL
          value: {{ $keycloakPublicUrl | quote }}
        - name: KC_HOSTNAME_ADMIN_URL
          value: {{ $keycloakPublicUrl | quote }}
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HEALTH_ENABLED
          value: "true"
