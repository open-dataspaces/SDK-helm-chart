apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logging.base" . }}-silo
spec:
  replicas: {{ .Values.silo.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "logging.base" . }}-silo
  template:
    metadata:
      labels:
        app: {{ include "logging.base" . }}-silo
    spec:
      containers:
      - name: silo
        image: "{{ .Values.silo.image.repository }}:{{ .Values.silo.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args: ["server", "/data", "--console-address", ":{{ .Values.silo.service.consolePort }}"]
        ports:
        - containerPort: {{ .Values.silo.service.apiPort }}
        - containerPort: {{ .Values.silo.service.consolePort }}
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "logging.base" . }}-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "logging.base" . }}-secrets
              key: MINIO_ROOT_PASSWORD
        volumeMounts:
        - name: silo-data
          mountPath: /data
      volumes:
      - name: silo-data
        persistentVolumeClaim:
          claimName: {{ include "logging.base" . }}-silo-data
